version: "3.9"

services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data



  web:
    build: .
    depends_on:
      - db
    ports:
      - "8000:8000"

  bot:
    build: .
    depends_on:
      - web
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - API_URL=http://web:8000
    command: python bot.py

volumes:
  postgres_data: